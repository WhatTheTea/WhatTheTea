name: Update README

on: 
    workflow_dispatch:
    schedule:
        - cron: '0 0 */7 * *'

jobs:
    update-readme:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Checkout wts
              uses: actions/checkout@v4
              with:
                repository: 'WhatTheTea/whatthestats'
                path: .tools/wts/
        
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '10.0.x'
            
            - name: Run dotnet tool
              run: > 
                dotnet run --project .tools/wts/whatthestats/whatthestats.csproj
                -- WhatTheTea 

            - name: Cleanup temporary tool files
              run: rm -rf .tools

            - name: Commit and push
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                git add README.md
                git diff --staged --quiet || (git commit -m "WhatTheStats: Update README.md" && git push)